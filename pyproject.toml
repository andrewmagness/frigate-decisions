[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "frigate-decisions"
version = "0.1.0"
description = "Ask the Gemini Decisions API typed questions about Frigate events and publish calibrated answers to MQTT / Home Assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "paho-mqtt>=2.0,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
frigate-decisions = "frigate_decisions.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
